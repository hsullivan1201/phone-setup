; PJSIP configuration for HT701 ATA test setup

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[100]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=auth100
aors=100
language=fr
tone_zone=fr
direct_media=no
; HT701 stopped sending RFC2833/telephone-event DTMF (0 type-101 RTP packets seen
; on a live call, only type-00 audio), which broke the ConfBridge radio menu keys
; (4/5/6/7/8/9). It still advertised telephone-event in SDP, so dtmf_mode=auto
; picked RFC4733 and missed the digits too — only forcing "inband" (DSP tone
; detection on the ulaw audio) made the menu keys work again. Verified 2026-05-27.
dtmf_mode=inband
rtp_symmetric=yes
rtp_timeout=30
device_state_busy_at=1

[auth100]
type=auth
auth_type=userpass
password=changeme
username=100

[100]
type=aor
max_contacts=1
qualify_frequency=30

; === SPEAKER ENDPOINT (baresip on localhost, ext 150) ===

[150]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=auth150
aors=150
direct_media=no

[auth150]
type=auth
auth_type=userpass
username=150
password=speakerpass

[150]
type=aor
max_contacts=1
remove_existing=yes
