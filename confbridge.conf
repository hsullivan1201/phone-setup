; ConfBridge profiles for radio-to-speaker routing

; Bridge profile — shared by all radio bridges
[radio_bridge]
type=bridge
max_members=10
mixing_interval=20

; User profile for the radio stream (leaves when no marked users remain)
[radio_user]
type=user
admin=yes
quiet=yes
announce_user_count=no
end_marked=yes

; User profile for the speaker (kicked when handset leaves)
[speaker_user]
type=user
admin=no
startmuted=no
quiet=yes
announce_user_count=no
wait_marked=yes
end_marked=yes

; User profile for the JAZZ handset (marked — bridge tears down when handset leaves)
[handset_user]
type=user
admin=no
marked=yes
startmuted=no
quiet=yes
announce_user_count=no

; DTMF menu for the handset inside a radio bridge
[handset_menu]
type=menu
4=dialplan_exec(now-playing,info,1)
5=dialplan_exec(speaker-control,on,1)
6=dialplan_exec(speaker-control,off,1)
7=dialplan_exec(speaker-stream,start,1)
8=dialplan_exec(speaker-volume,down,1)
9=dialplan_exec(speaker-volume,up,1)

; =============================================
; DJ COOL (ext 205)
; DJ Cool is an AudioSocket voice agent, not a stream, so it can't use
; ConfBridge's native DTMF menu unless the call goes through a bridge.
; Ext 205 drops the handset into a bridge and injects the agent's
; AudioSocket as a Local channel (same trick the radio stations use for
; their streams). That lets the handset's 8/9 keys hit the same
; speaker-volume context the radio menu uses.
; =============================================

; Agent leg (AudioSocket source). wait_marked: don't mix the agent in until
; the handset has joined, so the greeting isn't lost into an empty bridge.
; end_marked: leave when the handset (marked) hangs up.
; jitterbuffer: the agent paces its own TTS frames in software, so they arrive
; at the bridge unevenly. ConfBridge mixes on a strict 20ms clock, so without a
; jitter buffer the agent's voice comes out garbled. (Radio doesn't need this —
; MP3Player streams steadily. A direct AudioSocket-to-handset path didn't either,
; because the handset's RTP jitter buffer absorbed it.)
[djcool_agent_user]
type=user
admin=yes
startmuted=no
quiet=yes
announce_user_count=no
wait_marked=yes
end_marked=yes
jitterbuffer=yes

; Handset menu for DJ Cool — volume only (track control is by voice).
[djcool_menu]
type=menu
8=dialplan_exec(speaker-volume,down,1)
9=dialplan_exec(speaker-volume,up,1)
